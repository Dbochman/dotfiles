apiVersion: crisismode/v1
kind: SiteConfig
metadata:
  name: dylans-mac-mini
  environment: production

# No hub — standalone spoke mode
# No webhook — health checks via CLI and MCP only

execution:
  mode: dry-run

# v0.10 requires a nonempty target/service list. These are the same local
# checks scan would inject, explicitly scoped to this Mini; no PostgreSQL target.
# Gateway and launchd health plugins are installed in ~/.crisismode/checks/.
targets:
  - name: local-dns
    kind: dns
    primary: { host: auto, port: 53 }
  - name: local-disk
    kind: disk
    primary: { host: auto, port: 0 }
